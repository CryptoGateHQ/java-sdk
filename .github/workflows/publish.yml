name: publish
# STUB — Maven Central needs a Sonatype Central Portal account + a published GPG key. Fill the
# secrets (CENTRAL_TOKEN_USER/PASSWORD, GPG_PRIVATE_KEY, GPG_PASSPHRASE) and enable the deploy
# step below before this publishes anything. See docs/sdk/RELEASING.md.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  maven-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build (publish disabled until Sonatype + GPG are configured)
        run: mvn -B -DskipTests package
      # - name: Deploy to Maven Central
      #   run: mvn -B -DskipTests deploy -P release
      #   env:
      #     CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USER }}
      #     CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      #     MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      #     MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
